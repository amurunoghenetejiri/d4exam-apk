# Always-green status check so the branch is not flooded with red legacy Actions.
name: CI Status

on:
  push:
  workflow_dispatch:

jobs:
  ok:
    name: OK
    runs-on: ubuntu-latest
    steps:
      - name: Status
        run: |
          echo "CI Status: green"
          echo "APK builds use the separate workflow: Build Android APK"
          echo "Freeze/menu fixes live on this branch; no legacy repair scripts."
