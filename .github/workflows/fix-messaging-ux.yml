name: Fix messaging UX

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-messaging-ux.yml'

permissions:
  contents: write

concurrency:
  group: fix-messaging-ux
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply messaging UX fixes
        run: |
          python3 << 'PY'
          from pathlib import Path

          mm = Path("src/components/messaging/MessageMedia.tsx")
          t = mm.read_text()

          if "export function stopAllVoices" not in t:
              t = t.replace(
                  "function onVoiceEnded(id: string) {",
                  "export function stopAllVoices() {\n  if (activeVoiceId) {\n    voiceMap.get(activeVoiceId)?.pause();\n    activeVoiceId = null;\n  }\n  for (const [, reg] of voiceMap) {\n    try { reg.pause(); } catch { /* ignore */ }\n  }\n}\n\nfunction onVoiceEnded(id: string) {",
              )

          old_time = "  const effectiveDur = dur > 0 ? dur : (durationSec != null && durationSec > 0 ? durationSec : 0);\n  const timeShown = effectiveDur > 0 ? fmtDur(effectiveDur) : (playing ? fmtDur(cur) : \"0:00\");"
          new_time = "  const effectiveDur = dur > 0 ? dur : (durationSec != null && durationSec > 0 ? durationSec : 0);\n  // While playing: show elapsed from 0:00 upward; idle: show total duration\n  const timeShown = playing\n    ? fmtDur(cur)\n    : (effectiveDur > 0 ? fmtDur(effectiveDur) : \"0:00\");"
          if old_time in t:
              t = t.replace(old_time, new_time)

          t = t.replace(
              "progress={dur > 0 ? cur / dur : 0}",
              "progress={effectiveDur > 0 ? Math.min(1, cur / effectiveDur) : 0}",
          )

          t = t.replace(
              '''      onTouchStart={(e) => e.stopPropagation()}\n      onTouchMove={(e) => e.stopPropagation()}\n    >''',
              ">",
              1,
          )

          if "export function ImageLightbox" in t:
              start = t.find("export function ImageLightbox")
              nexts = []
              for name in ["export function VideoBubble", "export function VideoLightbox", "export function FileBubble", "export function LongPressMenu"]:
                  i = t.find(name, start + 10)
                  if i > start:
                      nexts.append(i)
              end = min(nexts) if nexts else len(t)
              new_il = '''export function ImageLightbox({
  urls,
  index = 0,
  onClose,
}: {
  urls: string[];
  index?: number;
  onClose: () => void;
}) {
  const list = urls.length ? urls : [];
  const [idx, setIdx] = useState(Math.max(0, Math.min(index, Math.max(0, list.length - 1))));
  const [scale, setScale] = useState(1);
  const [tx, setTx] = useState(0);
  const [ty, setTy] = useState(0);
  const drag = useRef<{ x: number; y: number; mode: "none" | "pan" | "swipe" | "dismiss"; startTx: number; startTy: number } | null>(null);
  const [dragX, setDragX] = useState(0);
  const [dragY, setDragY] = useState(0);

  useEffect(() => {
    setIdx(Math.max(0, Math.min(index, Math.max(0, list.length - 1))));
    setScale(1); setTx(0); setTy(0); setDragX(0); setDragY(0);
  }, [index, list.length]);

  if (!list.length) return null;
  const src = list[idx];

  const onPointerDown = (e: React.PointerEvent) => {
    (e.currentTarget as HTMLElement).setPointerCapture?.(e.pointerId);
    drag.current = { x: e.clientX, y: e.clientY, mode: "none", startTx: tx, startTy: ty };
  };
  const onPointerMove = (e: React.PointerEvent) => {
    const d = drag.current;
    if (!d) return;
    const dx = e.clientX - d.x;
    const dy = e.clientY - d.y;
    if (d.mode === "none") {
      if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
      if (scale > 1.05) d.mode = "pan";
      else if (Math.abs(dy) > Math.abs(dx) && dy > 0) d.mode = "dismiss";
      else d.mode = "swipe";
    }
    if (d.mode === "pan") { setTx(d.startTx + dx); setTy(d.startTy + dy); }
    else if (d.mode === "swipe") setDragX(dx);
    else if (d.mode === "dismiss") setDragY(Math.max(0, dy));
  };
  const onPointerUp = () => {
    const d = drag.current;
    drag.current = null;
    if (!d) return;
    if (d.mode === "dismiss") {
      if (dragY > 90) onClose();
      setDragY(0);
      return;
    }
    if (d.mode === "swipe") {
      if (dragX < -60 && idx < list.length - 1) { setIdx(idx + 1); setScale(1); setTx(0); setTy(0); }
      else if (dragX > 60 && idx > 0) { setIdx(idx - 1); setScale(1); setTx(0); setTy(0); }
      setDragX(0);
      return;
    }
    setDragX(0); setDragY(0);
  };

  return (
    <div className="fixed inset-0 z-[100] flex flex-col bg-black/95" style={{ opacity: dragY > 0 ? Math.max(0.35, 1 - dragY / 320) : 1 }}>
      <div className="flex items-center justify-between px-3 pt-[max(0.75rem,env(safe-area-inset-top))] pb-2 text-white">
        <button type="button" onClick={onClose} className="grid h-10 w-10 place-items-center rounded-full bg-white/15" aria-label="Back">
          <X className="h-5 w-5" />
        </button>
        <span className="text-sm font-semibold tabular-nums">{list.length > 1 ? `${idx + 1} / ${list.length}` : "Photo"}</span>
        <span className="w-10" />
      </div>
      <div
        className="relative flex min-h-0 flex-1 items-center justify-center overflow-hidden touch-none"
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={onPointerUp}
        onPointerCancel={onPointerUp}
        onDoubleClick={() => { if (scale > 1) { setScale(1); setTx(0); setTy(0); } else setScale(2.4); }}
        style={{ transform: `translateY(${dragY}px)` }}
      >
        <img
          src={src}
          alt=""
          draggable={false}
          className="max-h-full max-w-full select-none object-contain"
          style={{
            transform: `translate(${tx + dragX}px, ${ty}px) scale(${scale})`,
            transition: drag.current ? "none" : "transform 0.22s ease-out",
            transformOrigin: "center center",
          }}
        />
      </div>
      {list.length > 1 ? (
        <div className="flex justify-center gap-1.5 pb-[max(1rem,env(safe-area-inset-bottom))] pt-2">
          {list.map((_, i) => (
            <button key={i} type="button" onClick={() => { setIdx(i); setScale(1); setTx(0); setTy(0); }} className={cn("h-1.5 rounded-full transition-all", i === idx ? "w-5 bg-white" : "w-1.5 bg-white/40")} />
          ))}
        </div>
      ) : (
        <div className="pb-[max(0.75rem,env(safe-area-inset-bottom))]" />
      )}
    </div>
  );
}

'''
              t = t[:start] + new_il + t[end:]

          mm.write_text(t)
          print("MessageMedia updated")

          sc = Path("src/routes/student.contact-officer.tsx")
          s = sc.read_text()

          if "stopAllVoices" not in s:
              s = s.replace(
                  'parseOfficerReply } from "@/components/messaging/MessageMedia";',
                  'parseOfficerReply, stopAllVoices } from "@/components/messaging/MessageMedia";',
              )

          s = s.replace(
              '"mb-0.5 grid h-14 w-14 place-items-center rounded-full shadow-xl transition active:scale-95",
                  "bg-gradient-to-b from-[#60a5fa] via-[#3b82f6] to-[#1d4ed8] text-white",
                  "ring-[3px] ring-white/70 ring-offset-2 ring-offset-[#0b1b3a]",
                )}\n                onClick={() => void startRec()}\n                aria-label="Record voice note"\n              >\n                <Mic className="h-7 w-7 stroke-[2.5]" />',
              '"mb-0.5 grid h-11 w-11 place-items-center rounded-full shadow-lg transition active:scale-95",
                  "bg-gradient-to-b from-[#60a5fa] via-[#3b82f6] to-[#1d4ed8] text-white",
                  "ring-2 ring-white/60 ring-offset-1 ring-offset-[#0b1b3a]",
                )}\n                onClick={() => void startRec()}\n                aria-label="Record voice note"\n              >\n                <Mic className="h-5 w-5 stroke-[2.25]" />',
          )

          if "stopAllVoices()" not in s:
              s = s.replace(
                  "async function startRec() {\n    if (recording) return;\n    try {",
                  "async function startRec() {\n    if (recording) return;\n    try {\n      try { stopAllVoices(); } catch { /* ignore */ }",
              )

          s = s.replace(
              'const swipeRef = useRef<{ key: string; id: string; x: number; y: number; axis: "none" | "h" | "v"; side: "in" | "out" } | null>(null);',
              'const swipeRef = useRef<{ key: string; id: string; x: number; y: number; axis: "none" | "h" | "v"; side: "in" | "out"; dx: number } | null>(null);',
          )

          # Bidirectional drag + ref-based threshold (fixes own-message reply + stale state)
          old_block = '''if (s.axis === "v") return; // allow normal vertical scroll
                  // Incoming: swipe right; own: swipe left (or either direction)
                  let next = 0;
                  if (m.side === "out") {
                    next = Math.max(-72, Math.min(0, rawX));
                  } else {
                    next = Math.min(72, Math.max(0, rawX));
                  }
                  setSwipeDx((prev) => (prev[m.key] === next ? prev : { ...prev, [m.key]: next }));
                }}
                onTouchEnd={() => {
                  endLP();
                  const s = swipeRef.current;
                  const finalDx = swipeDx[m.key] || 0;'''

          new_block = '''if (s.axis === "v") return;
                  const next = Math.max(-80, Math.min(80, rawX));
                  s.dx = next;
                  setSwipeDx((prev) => (prev[m.key] === next ? prev : { ...prev, [m.key]: next }));
                  try { e.preventDefault(); } catch { /* ignore */ }
                }}
                onTouchEnd={() => {
                  endLP();
                  const s = swipeRef.current;
                  const finalDx = s?.dx ?? swipeDx[m.key] ?? 0;'''

          if old_block in s:
              s = s.replace(old_block, new_block)
              print("swipe fixed")
          else:
              print("WARN swipe")

          s = s.replace(
              '''                    axis: "none",
                    side: m.side,
                  };''',
              '''                    axis: "none",
                    side: m.side,
                    dx: 0,
                  };''',
          )

          s = s.replace(
              '''                  <div
                    onTouchStart={(e) => e.stopPropagation()}
                    onTouchMove={(e) => e.stopPropagation()}
                    onPointerDown={(e) => e.stopPropagation()}
                  >
                    <VoiceBubble id={`msg-${m.key}`} src={m.attachment_url!} mine={m.side === "out"} timeLabel={formatTime(m.at)} tick={m.side === "out" ? outTick : "none"} durationSec={m.durationSec} />
                  </div>''',
              '''                  <VoiceBubble id={`msg-${m.key}`} src={m.attachment_url!} mine={m.side === "out"} timeLabel={formatTime(m.at)} tick={m.side === "out" ? outTick : "none"} durationSec={m.durationSec} />''',
          )

          old_scroll = 'className="absolute bottom-[5.25rem] lg:bottom-28 right-4 lg:right-8 z-30 flex items-center gap-1.5 rounded-full bg-[#0b1b3a] px-3.5 py-2.5 lg:px-4 lg:py-3 text-xs lg:text-sm font-bold text-white shadow-xl ring-2 ring-blue-400/50 animate-pulse"\n        >\n          <span className="text-base leading-none" aria-hidden>↓</span>'
          new_scroll = 'className="absolute bottom-[5.25rem] lg:bottom-28 left-1/2 z-30 flex -translate-x-1/2 items-center gap-1.5 rounded-full bg-gradient-to-b from-[#60a5fa] via-[#3b82f6] to-[#1d4ed8] px-4 py-2.5 lg:px-5 lg:py-3 text-xs lg:text-sm font-bold text-white shadow-xl ring-2 ring-white/50"\n        >\n          <span className="inline-block text-lg font-black leading-none" aria-hidden style={{ animation: "d4ScrollArrowBounce 1.05s ease-in-out infinite" }}>↓</span>\n          <style>{`@keyframes d4ScrollArrowBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }`}</style>'
          if old_scroll in s:
              s = s.replace(old_scroll, new_scroll)
              print("scroll centered")
          else:
              print("WARN scroll")

          # Optimistic onFile - only if old version still present
          if "localUrls.push(URL.createObjectURL(file))" not in s:
              marker = "async function onFile(files: FileList | File[]) {"
              if marker in s:
                  # insert stop after length check by rewriting a short unique path
                  s = s.replace(
                      "async function onFile(files: FileList | File[]) {\n    const list = Array.from(files);\n    if (!list.length) return;\n    try {\n      const uploaded: string[] = [];\n      let kind: \"image\" | \"audio\" | \"file\" = \"file\";\n      for (const file of list) {\n        const up = await uploadMessageMedia(file, file.type || \"application/octet-stream\", `msg/${schoolId}/${userId}`);\n        uploaded.push(up.url);\n        if (up.type === \"image\") kind = \"image\";\n        else if (up.type === \"audio\") kind = \"audio\";\n      }\n      const url = uploaded.length > 1 ? JSON.stringify(uploaded) : uploaded[0];\n      await sendMessage(\"\", { url, type: kind });\n    } catch (e) {\n      toast.error(e instanceof Error ? e.message : \"Upload failed\");\n    }\n  }",
                      "async function onFile(files: FileList | File[]) {\n    const list = Array.from(files);\n    if (!list.length || !schoolId) return;\n    let kind: \"image\" | \"video\" | \"audio\" | \"file\" = \"file\";\n    const localUrls: string[] = [];\n    for (const file of list) {\n      const ft = (file.type || \"\").toLowerCase();\n      if (ft.startsWith(\"image/\")) kind = \"image\";\n      else if (ft.startsWith(\"video/\")) kind = kind === \"image\" ? \"image\" : \"video\";\n      else if (ft.startsWith(\"audio/\")) kind = \"audio\";\n      localUrls.push(URL.createObjectURL(file));\n    }\n    const localUrl = localUrls.length > 1 ? JSON.stringify(localUrls) : localUrls[0];\n    const clientId = `opt-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;\n    const nowIso = new Date().toISOString();\n    const replySnap = replyTo;\n    const optMsg: ChatMsg = {\n      key: `${clientId}-s`,\n      side: \"out\",\n      text: \"(attachment)\",\n      at: nowIso,\n      subject: replySnap ? `Re: ${(replySnap.text || \"\").slice(0, 40)}` : null,\n      attachment_url: localUrl,\n      attachment_type: kind === \"video\" ? \"video\" : kind,\n      reportId: clientId,\n      replyPreview: replySnap\n        ? `${replySnap.fromSelf ? (replySnap.senderName || session?.fullName || student?.fullName || \"Me\") : (replySnap.senderName || officerNickname || \"Officer\")}\\n${replySnap.text || \"\"}`\n        : null,\n      replyToKey: replySnap ? `${replySnap.id}-${replySnap.fromSelf ? \"s\" : \"o\"}` : null,\n    };\n    setOptimisticMsgs((prev) => [...prev, optMsg]);\n    setReplyTo(null);\n    setNearBottom(true);\n    setNewBelow(0);\n    requestAnimationFrame(() => chatEndRef.current?.scrollIntoView({ behavior: \"smooth\" }));\n    try {\n      const uploaded: string[] = [];\n      for (const file of list) {\n        const up = await uploadMessageMedia(file, file.type || \"application/octet-stream\", `msg/${schoolId}/${userId}`);\n        uploaded.push(up.url);\n      }\n      const url = uploaded.length > 1 ? JSON.stringify(uploaded) : uploaded[0];\n      const name = session?.fullName || student?.fullName || \"Student\";\n      const payload: Record<string, unknown> = {\n        school_id: schoolId,\n        student_id: studentId || null,\n        student_user_id: userId || null,\n        student_name: name,\n        student_matric: student?.matric || null,\n        exam_id: selectedExamIds[0] || null,\n        exam_title: selectedTitles[0] || null,\n        exam_ids: selectedExamIds.length ? selectedExamIds : [],\n        exam_titles: selectedTitles.length ? selectedTitles : [],\n        subject: replySnap ? `Re: ${(replySnap.text || \"\").slice(0, 40)}` : null,\n        body: \"(attachment)\",\n        status: \"open\",\n        attachment_url: url,\n        attachment_type: kind === \"video\" ? \"video\" : kind,\n        reply_to_id: replySnap?.id || null,\n      };\n      const { error } = await supabase.from(\"student_officer_reports\").insert(payload as never);\n      if (error) throw error;\n      setOptimisticMsgs((prev) => prev.filter((m) => m.key !== optMsg.key));\n      void qc.invalidateQueries({ queryKey: [\"student-my-reports\"] });\n    } catch (e) {\n      toast.error(e instanceof Error ? e.message : \"Upload failed\");\n    } finally {\n      for (const u of localUrls) { try { URL.revokeObjectURL(u); } catch { /* ignore */ } }\n    }\n  }",
                  )
                  print("optimistic onFile")

          sc.write_text(s)
          print("student updated")
          print("DONE")
          PY

      - name: Commit and push
        run: |
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.name.ng"
          git add src/components/messaging/MessageMedia.tsx src/routes/student.contact-officer.tsx || true
          if git diff --staged --quiet; then
            echo "No code changes"
          else
            git commit -m "fix(messaging): smaller mic, drag-to-reply, centered scroll, optimistic media, voice timer, lightbox pan"
            git push
          fi
