name: curl-restore-mm

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix onFile
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/routes/student.contact-officer.tsx")
          t = p.read_text()
          # Broken patterns from escaped template literals
          t2 = t.replace("const clientId = \\;", 'const clientId = "opt-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);')
          t2 = t2.replace("key: \\,", 'key: clientId + "-s",')
          t2 = t2.replace("subject: replySnap ? \\ : subject.trim() || null", 'subject: replySnap ? ("Re: " + (replySnap.text || "").slice(0, 40)) : subject.trim() || null')
          t2 = t2.replace("replyToKey: replySnap ? \\ : null", 'replyToKey: replySnap ? (replySnap.id + "-" + (replySnap.fromSelf ? "s" : "o")) : null')
          t2 = t2.replace(', \\);', ', "msg/" + schoolId + "/" + userId);')
          # alternate: single backslash without escaping in file
          if "const clientId = \\" in t2 or "const clientId = \\;" in t:
              pass
          # also handle exact chars from file: backslash then semicolon
          import re
          t2 = re.sub(r"const clientId = \\+";", 'const clientId = "opt-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);', t2)
          t2 = re.sub(r"key: \\+,", 'key: clientId + "-s",', t2)
          t2 = re.sub(r"subject: replySnap \? \\+ :", 'subject: replySnap ? ("Re: " + (replySnap.text || "").slice(0, 40)) :', t2)
          t2 = re.sub(r"replyToKey: replySnap \? \\+ : null", 'replyToKey: replySnap ? (replySnap.id + "-" + (replySnap.fromSelf ? "s" : "o")) : null', t2)
          t2 = re.sub(r", \\+";", ', "msg/" + schoolId + "/" + userId);', t2)
          p.write_text(t2)
          print("fixed", t != t2)
          print("still broken", "clientId = \\" in t2)
          PY
          git config user.name d4exam-bot
          git config user.email bot@d4exam.name.ng
          git add src/routes/student.contact-officer.tsx
          git commit -m "fix(messaging): repair optimistic onFile broken escapes" || echo nochange
          git push
