name: curl-restore-mm

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Strict wave seek + smooth swipe
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/components/messaging/MessageMedia.tsx")
          t = p.read_text()
          old = """      onPointerDown={(e) => {
        if (!onSeek) return;
        dragRef.current = { x: e.clientX, y: e.clientY, active: true, seeking: false };
      }}
      onPointerMove={(e) => {
        if (!onSeek || !dragRef.current?.active) return;
        const d = dragRef.current;
        const dx = e.clientX - d.x;
        const dy = e.clientY - d.y;
        if (!d.seeking) {
          if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
          if (Math.abs(dy) >= Math.abs(dx)) { d.active = false; return; }
          d.seeking = true;
          try { (e.currentTarget as HTMLElement).setPointerCapture?.(e.pointerId); } catch {}
          e.preventDefault();
          e.stopPropagation();
          seekFromClientX(e.clientX);
          return;
        }
        e.preventDefault();
        e.stopPropagation();
        seekFromClientX(e.clientX);
      }}
      onPointerUp={(e) => {
        if (dragRef.current?.seeking) e.stopPropagation();
        dragRef.current = null;
      }}
      onPointerCancel={() => { dragRef.current = null; }}
      onClick={(e) => {
        if (dragRef.current?.seeking) e.stopPropagation();
      }}"""
          new = """      style={onSeek ? { touchAction: "pan-y" } : undefined}
      onPointerDown={(e) => {
        if (!onSeek) return;
        // Arm only - do NOT move board/ball on mere touch or click
        dragRef.current = { x: e.clientX, y: e.clientY, active: true, seeking: false };
      }}
      onPointerMove={(e) => {
        if (!onSeek || !dragRef.current?.active) return;
        const d = dragRef.current;
        const dx = e.clientX - d.x;
        const dy = e.clientY - d.y;
        if (!d.seeking) {
          // Require clear intentional horizontal drag (22px). Vertical never seeks.
          if (Math.abs(dx) < 22) return;
          if (Math.abs(dy) >= Math.abs(dx) * 0.55) { d.active = false; return; }
          d.seeking = true;
          try { (e.currentTarget as HTMLElement).setPointerCapture?.(e.pointerId); } catch {}
          e.preventDefault();
          e.stopPropagation();
          seekFromClientX(e.clientX);
          return;
        }
        e.preventDefault();
        e.stopPropagation();
        seekFromClientX(e.clientX);
      }}
      onPointerUp={(e) => {
        if (dragRef.current?.seeking) e.stopPropagation();
        dragRef.current = null;
      }}
      onPointerCancel={() => { dragRef.current = null; }}
      onClick={(e) => {
        // Never seek on click/tap - only drag moves the board
        e.stopPropagation();
      }}"""
          if old not in t:
              raise SystemExit("wave handlers not found")
          t = t.replace(old, new, 1)
          t = t.replace(
              'className={cn("relative flex h-7 w-full items-center gap-[1.5px] overflow-visible px-1", onSeek && "cursor-pointer touch-none")}',
              'className={cn("relative flex h-7 w-full items-center gap-[1.5px] overflow-visible px-1", onSeek && "cursor-pointer")}',
              1,
          )
          p.write_text(t)
          print("wave strict ok", len(t))

          c = Path("src/routes/student.contact-officer.tsx")
          ct = c.read_text()
          n = 0
          a = 'transition: dx === 0 ? "transform 0.28s cubic-bezier(.2,.85,.25,1)" : "none"'
          b = 'transition: dx === 0 ? "transform 0.32s cubic-bezier(.22,.9,.28,1)" : "none"'
          if a in ct:
              ct = ct.replace(a, b)
              n += 1
          a3 = """if (Math.abs(rawX) < 8 && Math.abs(rawY) < 8) return;
                    s.axis = Math.abs(rawX) > Math.abs(rawY) ? "h" : "v";"""
          b3 = """if (Math.abs(rawX) < 12 && Math.abs(rawY) < 12) return;
                    s.axis = Math.abs(rawX) > Math.abs(rawY) * 1.15 ? "h" : "v";"""
          if a3 in ct:
              ct = ct.replace(a3, b3)
              n += 1
          c.write_text(ct)
          print("swipe smooth", n)
          PY
          git config user.name d4exam-bot
          git config user.email bot@d4exam.name.ng
          git add src/components/messaging/MessageMedia.tsx src/routes/student.contact-officer.tsx
          git diff --cached --stat
          git commit -m "fix(messaging): voice board only moves on real horizontal drag; smooth reply swipe" || echo nochange
          git push
