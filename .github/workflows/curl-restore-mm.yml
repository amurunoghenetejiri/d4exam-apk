name: curl-restore-mm

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch WaveBars + onFile + swipe
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          import re

          mm = Path("src/components/messaging/MessageMedia.tsx")
          t = mm.read_text()

          # Replace WaveBars seek handlers: drag-only, horizontal axis lock
          old_wb = '''  const seekFromClientX = (clientX: number) => {
    const el = trackRef.current;
    if (!el || !onSeek) return;
    const rect = el.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / Math.max(1, rect.width)));
    onSeek(ratio);
  };

  return (
    <div
      ref={trackRef}
      className={cn("relative flex h-7 w-full items-center gap-[1.5px] overflow-visible px-1", onSeek && "cursor-pointer touch-none")}
      onPointerDown={(e) => {
        if (!onSeek) return;
        e.stopPropagation();
        e.preventDefault();
        (e.currentTarget as HTMLElement).setPointerCapture?.(e.pointerId);
        seekFromClientX(e.clientX);
      }}
      onPointerMove={(e) => {
        if (!onSeek || e.buttons !== 1) return;
        e.stopPropagation();
        seekFromClientX(e.clientX);
      }}
      onPointerUp={(e) => e.stopPropagation()}
      onClick={(e) => e.stopPropagation()}
      onTouchStart={(e) => {
        if (!onSeek) return;
        e.stopPropagation();
      }}
      onTouchMove={(e) => {
        if (!onSeek) return;
        e.stopPropagation();
      }}
    >'''

          new_wb = '''  const dragRef = useRef<{ x: number; y: number; active: boolean; seeking: boolean } | null>(null);

  const seekFromClientX = (clientX: number) => {
    const el = trackRef.current;
    if (!el || !onSeek) return;
    const rect = el.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / Math.max(1, rect.width)));
    onSeek(ratio);
  };

  return (
    <div
      ref={trackRef}
      className={cn("relative flex h-7 w-full items-center gap-[1.5px] overflow-visible px-1", onSeek && "cursor-pointer touch-none")}
      onPointerDown={(e) => {
        if (!onSeek) return;
        // Do NOT seek on mere touch — wait for horizontal drag
        dragRef.current = { x: e.clientX, y: e.clientY, active: true, seeking: false };
      }}
      onPointerMove={(e) => {
        if (!onSeek || !dragRef.current?.active) return;
        const d = dragRef.current;
        const dx = e.clientX - d.x;
        const dy = e.clientY - d.y;
        if (!d.seeking) {
          // Require intentional horizontal drag; ignore vertical / tiny taps
          if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
          if (Math.abs(dy) > Math.abs(dx)) {
            // vertical — abandon seek so parent swipe/scroll can work
            d.active = false;
            return;
          }
          d.seeking = true;
          try { (e.currentTarget as HTMLElement).setPointerCapture?.(e.pointerId); } catch {}
          e.preventDefault();
          e.stopPropagation();
          seekFromClientX(e.clientX);
          return;
        }
        e.preventDefault();
        e.stopPropagation();
        seekFromClientX(e.clientX);
      }}
      onPointerUp={(e) => {
        if (dragRef.current?.seeking) e.stopPropagation();
        dragRef.current = null;
      }}
      onPointerCancel={() => { dragRef.current = null; }}
      onClick={(e) => {
        // Tap on waves does nothing (play is the button). Stop only if we sought.
        if (dragRef.current?.seeking) e.stopPropagation();
      }}
    >'''

          if old_wb in t:
            t = t.replace(old_wb, new_wb, 1)
            print("WaveBars drag-only OK")
          else:
            print("WaveBars pattern miss — trying looser")
            if "seekFromClientX(e.clientX);" in t and "onPointerDown" in t:
              # force by replacing function body start
              print("partial match only")
            else:
              raise SystemExit("WaveBars not found")

          # Knob follows finger smoothly while seeking (no lag transition when dragging)
          t = t.replace(
            'style={{ left: `${pct * 100}%`, transition: active ? "none" : "left 50ms linear" }}',
            'style={{ left: `${pct * 100}%`, transition: "none" }}',
          )
          print("knob transition")

          mm.write_text(t)
          print("MessageMedia", len(t))

          # ---- student route: optimistic onFile (string concat only) ----
          sp = Path("src/routes/student.contact-officer.tsx")
          s = sp.read_text()

          m = re.search(r"async function onFile\(files: FileList \| File\[\]\) \{.*?\n  \}", s, re.S)
          if m:
            new_on = r'''  async function onFile(files: FileList | File[]) {
    const list = Array.from(files);
    if (!list.length) return;
    for (const file of list) {
      const mime = (file.type || "").toLowerCase();
      let kind: "image" | "video" | "audio" | "file" = "file";
      if (mime.startsWith("image/") || /\.(jpe?g|png|gif|webp)$/i.test(file.name)) kind = "image";
      else if (mime.startsWith("video/") || /\.(mp4|webm|mov)$/i.test(file.name)) kind = "video";
      else if (mime.startsWith("audio/")) kind = "audio";
      const localUrl = URL.createObjectURL(file);
      const clientId = "opt-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
      const nowIso = new Date().toISOString();
      const replySnap = replyTo;
      const optMsg: ChatMsg = {
        key: clientId + "-s",
        side: "out",
        text: "(attachment)",
        at: nowIso,
        subject: replySnap ? ("Re: " + (replySnap.text || "").slice(0, 40)) : subject.trim() || null,
        attachment_url: localUrl,
        attachment_type: kind,
        reportId: clientId,
        replyPreview: null,
        replyToKey: replySnap ? (replySnap.id + "-" + (replySnap.fromSelf ? "s" : "o")) : null,
      };
      setOptimisticMsgs((prev) => [...prev, optMsg]);
      setReplyTo(null);
      setPendingAttach(null);
      setNearBottom(true);
      setNewBelow(0);
      requestAnimationFrame(() => chatEndRef.current?.scrollIntoView({ behavior: "smooth" }));
      void (async () => {
        try {
          const up = await uploadMessageMedia(file, file.type || "application/octet-stream", "msg/" + schoolId + "/" + userId);
          const name = session?.fullName || student?.fullName || "Student";
          const payload: Record<string, unknown> = {
            school_id: schoolId,
            student_id: studentId || null,
            student_user_id: userId || null,
            student_name: name,
            student_matric: student?.matric || null,
            exam_id: selectedExamIds[0] || null,
            exam_title: null,
            exam_ids: selectedExamIds.length ? selectedExamIds : [],
            exam_titles: [],
            subject: optMsg.subject,
            body: "(attachment)",
            attachment_url: up.url,
            attachment_type: kind === "file" ? (up.type || "file") : kind,
            status: "open",
            reply_to_id: replySnap?.id || null,
          };
          const { error } = await supabase.from("student_officer_reports").insert(payload);
          if (error) throw error;
          setOptimisticMsgs((prev) => prev.filter((m) => m.reportId !== clientId));
          await qc.invalidateQueries({ queryKey: ["student-my-reports"] });
          try { URL.revokeObjectURL(localUrl); } catch {}
        } catch (e) {
          setFailedIds((s) => new Set(s).add(clientId));
          toast.error(e instanceof Error ? e.message : "Upload failed");
        }
      })();
    }
  }'''
            s = s[:m.start()] + new_on + s[m.end():]
            print("onFile optimistic OK")
          else:
            print("onFile miss")

          # Ensure swipe still smooth
          for a, b in [
            ("Math.max(-72, Math.min(72, dx))", "Math.max(-96, Math.min(96, dx))"),
            ("Math.max(-80, Math.min(80, rawX))", "Math.max(-96, Math.min(96, rawX))"),
            ("Math.abs(dx) > 48", "Math.abs(dx) > 40"),
            ("Math.abs(finalDx) > 48", "Math.abs(finalDx) > 40"),
          ]:
            if a in s:
              s = s.replace(a, b)
              print("swipe", a[:28])
          if 'willChange: "transform"' not in s and 'touchAction: "pan-y"' in s:
            s = s.replace('touchAction: "pan-y",', 'touchAction: "pan-y",\n                  willChange: "transform",')

          # Reply voice duration badge
          needle = '''              <p className="line-clamp-2 text-xs text-slate-700">
                {replyTo.text}
              </p>
            </div>
            <button type="button" onClick={() => setReplyTo(null)}'''
          insert = '''              <p className="line-clamp-2 text-xs text-slate-700">
                {replyTo.text}
              </p>
            </div>
            {replyTo.isVoice && replyTo.durationSec != null && replyTo.durationSec > 0 ? (
              <span className="shrink-0 self-center rounded-md bg-blue-100 px-2 py-0.5 text-[11px] font-bold tabular-nums text-blue-800">
                {fmtVoiceDur(replyTo.durationSec)}
              </span>
            ) : null}
            <button type="button" onClick={() => setReplyTo(null)}'''
          if needle in s and "fmtVoiceDur(replyTo.durationSec)" not in s:
            s = s.replace(needle, insert, 1)
            print("reply duration badge")

          # armReply duration from data-duration
          old_arm = """const kind = classifyMedia(m.attachment_type, m.attachment_url);
            const snippet = buildReplySnippet({
              kind,
              text: m.text && m.text !== "(attachment)" ? m.text : attachmentLabel(m.attachment_type, m.attachment_url),
              durationSec: m.durationSec ?? null,
            });"""
          new_arm = """const kind = classifyMedia(m.attachment_type, m.attachment_url);
            let durSec = m.durationSec ?? null;
            if (kind === "audio" && (durSec == null || !(durSec > 0))) {
              try {
                const el = document.getElementById("msg-" + m.key);
                const dAttr = el?.getAttribute("data-duration");
                if (dAttr) { const n = Number(dAttr); if (Number.isFinite(n) && n > 0) durSec = n; }
              } catch {}
            }
            const snippet = buildReplySnippet({
              kind,
              text: m.text && m.text !== "(attachment)" ? m.text : attachmentLabel(m.attachment_type, m.attachment_url),
              durationSec: durSec,
            });"""
          if old_arm in s:
            s = s.replace(old_arm, new_arm, 1)
            print("armReply duration")

          sp.write_text(s)
          print("student", len(s))
          print("ALL DONE")
          PY
          git config user.name d4exam-bot
          git config user.email bot@d4exam.name.ng
          git add src/components/messaging/MessageMedia.tsx src/routes/student.contact-officer.tsx
          git status
          git commit -m "fix(messaging): voice seek only on horizontal drag; optimistic media; smooth swipe; voice reply duration" || echo nochange
          git push
