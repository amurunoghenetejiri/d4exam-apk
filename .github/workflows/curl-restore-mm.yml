name: curl-restore-mm

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch ImageLightbox pinchRef
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/components/messaging/MessageMedia.tsx")
          t = p.read_text()
          # Only patch ImageLightbox block (before VideoLightbox)
          a = t.find("export function ImageLightbox")
          b = t.find("export function VideoLightbox")
          assert a > 0 and b > a, (a, b)
          head, mid, tail = t[:a], t[a:b], t[b:]
          if "const pinchRef = useRef" not in mid:
              old = "  const touchRef = useRef<{ x: number; y: number; dist?: number } | null>(null);\n"
              new = old + "  const pinchRef = useRef<{ dist: number; scale: number } | null>(null);\n"
              if old not in mid:
                  raise SystemExit("touchRef anchor missing in ImageLightbox")
              mid = mid.replace(old, new, 1)
              print("patched ImageLightbox pinchRef")
          else:
              print("ImageLightbox already has pinchRef")
          p.write_text(head + mid + tail)
          print("size", p.stat().st_size)
          PY
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.name.ng"
          git add src/components/messaging/MessageMedia.tsx
          git commit -m "fix(messaging): declare pinchRef inside ImageLightbox" || echo nochange
          git push origin HEAD:main
