name: curl-restore-mm

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix WaveBars seek
        run: |
          python3 -c "
          from pathlib import Path
          p = Path('src/components/messaging/MessageMedia.tsx')
          t = p.read_text()
          if 'dragRef = useRef<{ x: number; y: number; active' not in t:
            t = t.replace(
              'const trackRef = useRef<HTMLDivElement>(null);',
              'const trackRef = useRef<HTMLDivElement>(null);\n  const dragRef = useRef<{ x: number; y: number; active: boolean; seeking: boolean } | null>(null);',
              1,
            )
          old = '''      onPointerDown={(e) => {\n        if (!onSeek) return;\n        e.stopPropagation();\n        e.preventDefault();\n        (e.currentTarget as HTMLElement).setPointerCapture?.(e.pointerId);\n        seekFromClientX(e.clientX);\n      }}\n      onPointerMove={(e) => {\n        if (!onSeek || e.buttons !== 1) return;\n        e.stopPropagation();\n        seekFromClientX(e.clientX);\n      }}\n      onPointerUp={(e) => e.stopPropagation()}\n      onClick={(e) => e.stopPropagation()}\n      onTouchStart={(e) => {\n        if (!onSeek) return;\n        e.stopPropagation();\n      }}\n      onTouchMove={(e) => {\n        if (!onSeek) return;\n        e.stopPropagation();\n      }}'''
          new = '''      onPointerDown={(e) => {\n        if (!onSeek) return;\n        dragRef.current = { x: e.clientX, y: e.clientY, active: true, seeking: false };\n      }}\n      onPointerMove={(e) => {\n        if (!onSeek || !dragRef.current?.active) return;\n        const d = dragRef.current;\n        const dx = e.clientX - d.x;\n        const dy = e.clientY - d.y;\n        if (!d.seeking) {\n          if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;\n          if (Math.abs(dy) >= Math.abs(dx)) { d.active = false; return; }\n          d.seeking = true;\n          try { (e.currentTarget as HTMLElement).setPointerCapture?.(e.pointerId); } catch {}\n          e.preventDefault();\n          e.stopPropagation();\n          seekFromClientX(e.clientX);\n          return;\n        }\n        e.preventDefault();\n        e.stopPropagation();\n        seekFromClientX(e.clientX);\n      }}\n      onPointerUp={(e) => {\n        if (dragRef.current?.seeking) e.stopPropagation();\n        dragRef.current = null;\n      }}\n      onPointerCancel={() => { dragRef.current = null; }}\n      onClick={(e) => {\n        if (dragRef.current?.seeking) e.stopPropagation();\n      }}'''
          if old not in t:
            raise SystemExit('handlers not found')
          t = t.replace(old, new, 1)
          t = t.replace('transition: active ? \"none\" : \"left 50ms linear\"', 'transition: \"none\"')
          p.write_text(t)
          print('wave ok', len(t))
          "
          git config user.name d4exam-bot
          git config user.email bot@d4exam.name.ng
          git add src/components/messaging/MessageMedia.tsx
          git commit -m "fix(messaging): voice progress ball only moves on intentional horizontal drag" || echo nochange
          git push
