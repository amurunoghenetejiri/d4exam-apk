name: curl-restore-mm

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore MessageMedia from good commit
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/amurunoghenetejiri/d4exam-web/10bfb17c1a1705b0cbc23d642857105bcbaa13ff/src/components/messaging/MessageMedia.tsx" -o src/components/messaging/MessageMedia.tsx
          wc -c src/components/messaging/MessageMedia.tsx
          head -3 src/components/messaging/MessageMedia.tsx
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/components/messaging/MessageMedia.tsx")
          t = p.read_text()
          old = "  const touchRef = useRef<{ x: number; y: number; dist?: number } | null>(null);\n"
          new = old + "  const pinchRef = useRef<{ dist: number; scale: number } | null>(null);\n"
          if "const pinchRef = useRef" not in t and old in t:
              t = t.replace(old, new, 1)
              p.write_text(t)
              print("added pinchRef")
          else:
              print("pinchRef already present or anchor missing")
          print("final size", p.stat().st_size)
          PY
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.name.ng"
          git add src/components/messaging/MessageMedia.tsx
          git status
          git commit -m "fix(messaging): restore MessageMedia from 10bfb17 + pinchRef declare" || echo "no changes"
          git push origin HEAD:main
