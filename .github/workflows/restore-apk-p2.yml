name: restore-apk-p2
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-apk-p2.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore from good SHA and patch
        run: |
          python3 << 'PY'
          from pathlib import Path
          import subprocess, re

          GOOD = "63aca1e70d8dc1ce87c3718798f7e31e5d96844d"
          files = [
              "src/components/NotificationPermissionPrompt.tsx",
              "src/routes/__root.tsx",
              "src/lib/screen-share.ts",
              "src/components/security/FingerprintLockGate.tsx",
          ]
          for f in files:
              r = subprocess.run(
                  ["git", "show", f"{GOOD}:{f}"],
                  capture_output=True,
              )
              if r.returncode != 0:
                  print("FAIL restore", f, r.stderr[:200])
                  continue
              Path(f).write_bytes(r.stdout)
              print("restored", f, len(r.stdout))

          # --- FingerprintLockGate ---
          p = Path("src/components/security/FingerprintLockGate.tsx")
          t = p.read_text()
          t = re.sub(
              r"const canFp = Boolean\(\s*native &&\s*fpEnabled &&\s*hwState !== \"no\",\s*\);",
              'const canFp = Boolean(native && hwState !== "no");',
              t,
          )
          t = t.replace(
              'const canFp = Boolean(native && fpEnabled && hwState !== "no");',
              'const canFp = Boolean(native && hwState !== "no");',
          )
          t = t.replace(
              'const canFp = Boolean(fpEnabled && hwState !== "no");',
              'const canFp = Boolean(hwState !== "no");',
          )
          if "|| canFp" not in t:
              t = t.replace(
                  "const unlockConfigured = hasAppPw || fpEnabled;",
                  "const unlockConfigured = hasAppPw || fpEnabled || canFp;",
              )
          t = t.replace("Use password\n", "Use password instead\n")
          needle = """          ) : (
            <span />
          )}"""
          repl = """          ) : hwState !== "no" ? (
            <button
              type="button"
              onClick={showFingerprintMode}
              className="inline-flex items-center gap-2 rounded-full px-3.5 py-2 text-sm font-semibold text-slate-300 transition hover:bg-white/10 hover:text-white md:px-4 md:py-2.5 md:text-base"
            >
              Use fingerprint
            </button>
          ) : (
            <span />
          )}"""
          idx = t.find("Log out")
          if idx > 0 and needle in t[idx:]:
              t = t[:idx] + t[idx:].replace(needle, repl, 1)
              print("fp: switch btn")
          p.write_text(t)
          print("fp", p.stat().st_size)

          # --- NotificationPermissionPrompt ---
          np = Path("src/components/NotificationPermissionPrompt.tsx")
          nt = np.read_text()
          nt2 = re.sub(
              r"(useEffect\(\(\) => \{)\s*const uid = session\?\.userId;\s*if \(!uid\) return;",
              r"\1",
              nt,
              count=1,
          )
          if nt2 != nt:
              nt = nt2
              print("notif: uid gate removed")
          if "}, [session?.userId, session?.role]);" in nt:
              nt = nt.replace(
                  "}, [session?.userId, session?.role]);",
                  "}, []); // OS notif prompt independent of session",
                  1,
              )
              print("notif: deps")
          nt = nt.replace(
              "// After login: request REAL Android notification permission",
              "// App entry: request REAL Android notification permission",
          )
          np.write_text(nt)
          print("notif", np.stat().st_size)

          # --- __root NativeBootstrap ---
          root = Path("src/routes/__root.tsx")
          rt = root.read_text()
          if "d4_native_os_notif_asked_v2" not in rt:
              block = '''
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        try {
          if (localStorage.getItem("d4_native_os_notif_asked_v2") === "1") return;
        } catch { /* ignore */ }
        const { waitForNativeShell, isNativeShell } = await import("@/native/platform");
        let ready = isNativeShell() || (await waitForNativeShell(12_000));
        if (!ready) {
          await new Promise((r) => setTimeout(r, 1500));
          ready = isNativeShell() || (await waitForNativeShell(6_000));
        }
        if (cancelled || !ready) return;
        await new Promise((r) => setTimeout(r, 800));
        if (cancelled) return;
        let display = "default";
        try {
          const { registerPlugin } = await import("@capacitor/core");
          const auth = registerPlugin<{
            checkNotificationPermission: () => Promise<{ display?: string }>;
            requestNotificationPermission: () => Promise<{ display?: string }>;
          }>("D4NativeAuth");
          const cur = await auth.checkNotificationPermission();
          display = (cur?.display || "default").toLowerCase();
          if (display !== "granted" && display !== "denied") {
            const req = await auth.requestNotificationPermission();
            display = (req?.display || display).toLowerCase();
          }
        } catch {
          try {
            const { LocalNotifications } = await import("@capacitor/local-notifications");
            const cur = await LocalNotifications.checkPermissions();
            display = (cur.display || "default").toLowerCase();
            if (display !== "granted" && display !== "denied") {
              const req = await LocalNotifications.requestPermissions();
              display = (req.display || display).toLowerCase();
            }
          } catch {
            return;
          }
        }
        if (display === "granted" || display === "denied") {
          try { localStorage.setItem("d4_native_os_notif_asked_v2", "1"); } catch { /* ignore */ }
        }
      } catch (e) {
        console.warn("[D4EXAM] NativeBootstrap notif", e);
      }
    })();
    return () => { cancelled = true; };
  }, []);
'''
              idx = rt.find("function NativeBootstrap()")
              if idx >= 0:
                  ridx = rt.find("  return null;\n}", idx)
                  if ridx > idx:
                      rt = rt[:ridx] + block + "\n" + rt[ridx:]
                      print("root: inject")
              root.write_text(rt)
          print("root", root.stat().st_size)

          # --- screen-share ---
          ss = Path("src/lib/screen-share.ts")
          st = ss.read_text()
          if "Capacitor/i.test(ua)" not in st:
              st = st.replace(
                  "if (/; wv\\)/i.test(ua) && /Android/i.test(ua)) return true;",
                  "if (/; wv\\)/i.test(ua) && /Android/i.test(ua)) return true;\n    if (/Android/i.test(ua) && /Capacitor/i.test(ua)) return true;",
              )
              print("ss: ua")
          ss.write_text(st)
          print("ss", ss.stat().st_size)

          print("DONE")
          PY
      - name: Commit
        run: |
          git config user.name d4exam-bot
          git config user.email bot@d4exam.local
          git add -A
          git commit -m "fix(android): fingerprint primary, notif on entry, screen native detect" || echo nochange
          git push origin main
