name: restore-message-media
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/restore-message-media.yml
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore MessageMedia from good commit
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --all
          git show 10bfb17c1a1705b0cbc23d642857105bcbaa13ff:src/components/messaging/MessageMedia.tsx > /tmp/mm.tsx
          wc -c /tmp/mm.tsx
          # declare pinchRef in ImageLightbox (was missing)
          python3 - <<'PY'
          from pathlib import Path
          t = Path("/tmp/mm.tsx").read_text()
          old = """  const [scale, setScale] = useState(1);
  const touchRef = useRef<{ x: number; y: number; dist?: number } | null>(null);
"""
          new = """  const [scale, setScale] = useState(1);
  const touchRef = useRef<{ x: number; y: number; dist?: number } | null>(null);
  const pinchRef = useRef<{ dist: number; scale: number } | null>(null);
"""
          if old not in t:
              print("WARN: anchor missing; writing unpatched")
          else:
              t = t.replace(old, new, 1)
              print("patched pinchRef")
          Path("src/components/messaging/MessageMedia.tsx").write_text(t)
          print("wrote", len(t))
          PY
          git config user.name "d4exam-bot"
          git config user.email "bot@d4exam.name.ng"
          git add src/components/messaging/MessageMedia.tsx
          git status
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(messaging): restore MessageMedia from 10bfb17 + pinchRef declare"
            git push origin HEAD:main
          fi
