name: fix-android-apk-final
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-android-apk-final.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore good sources and apply Android APK fixes
        run: |
          python3 << 'PY'
          from pathlib import Path
          import subprocess, re

          GOOD = "63aca1e70d8dc1ce87c3718798f7e31e5d96844d"

          def restore(path):
              r = subprocess.run(
                  ["git", "show", f"{GOOD}:{path}"],
                  capture_output=True,
              )
              if r.returncode != 0:
                  print("WARN cannot restore", path, r.stderr[:200])
                  return False
              Path(path).write_bytes(r.stdout)
              print("restored", path, len(r.stdout))
              return True

          files = [
              "src/components/security/FingerprintLockGate.tsx",
              "src/lib/screen-share.ts",
              "src/routes/__root.tsx",
              "src/components/NotificationPermissionPrompt.tsx",
              "src/native/fingerprintAuth.ts",
          ]
          for f in files:
              restore(f)

          # ===== 1. FingerprintLockGate: FP primary =====
          p = Path("src/components/security/FingerprintLockGate.tsx")
          t = p.read_text()

          t = re.sub(
              r"const canFp = Boolean\(\s*native &&\s*fpEnabled &&\s*hwState !== \"no\",\s*\);",
              'const canFp = Boolean(native && hwState !== "no");',
              t,
          )
          t = t.replace(
              'const canFp = Boolean(native && fpEnabled && hwState !== "no");',
              'const canFp = Boolean(native && hwState !== "no");',
          )
          t = t.replace(
              'const canFp = Boolean(fpEnabled && hwState !== "no");',
              'const canFp = Boolean(hwState !== "no");',
          )
          if "|| canFp" not in t:
              t = t.replace(
                  "const unlockConfigured = hasAppPw || fpEnabled;",
                  "const unlockConfigured = hasAppPw || fpEnabled || canFp;",
              )
          if "Use password instead" not in t:
              t = t.replace("Use password\n", "Use password instead\n")
              t = t.replace(">Use password<", ">Use password instead<")

          needle = "          ) : (\n            <span />\n          )}"
          repl = '''          ) : hwState !== "no" ? (
            <button
              type="button"
              onClick={showFingerprintMode}
              className="inline-flex items-center gap-2 rounded-full px-3.5 py-2 text-sm font-semibold text-slate-300 transition hover:bg-white/10 hover:text-white md:px-4 md:py-2.5 md:text-base"
            >
              Use fingerprint
            </button>
          ) : (
            <span />
          )}'''
          idx = t.find("Log out")
          if idx > 0 and needle in t[idx:]:
              t = t[:idx] + t[idx:].replace(needle, repl, 1)
              print("fp: switch-back button")
          elif needle in t and "onClick={showFingerprintMode}" not in t[t.find("Log out"):t.find("Log out")+800]:
              t = t.replace(needle, repl, 1)
              print("fp: switch-back button (fallback)")

          p.write_text(t)
          print("fp", p.stat().st_size, "canFp-native", t.count('canFp = Boolean(native && hwState !== "no")'))

          # ===== 2. fingerprintAuth cancel =====
          fa = Path("src/native/fingerprintAuth.ts")
          fat = fa.read_text()
          if "do NOT treat as hardware unavailable" not in fat:
              fat = fat.replace(
                  'return { ok: false, code: "cancelled", message: result.message || "Cancelled" };',
                  'return { ok: false, code: "cancelled", message: result.message || "Cancelled" }; // do NOT treat as hardware unavailable',
                  1,
              )
              fa.write_text(fat)
              print("fa: cancel note")

          # ===== 3. NotificationPermissionPrompt: no session gate =====
          np = Path("src/components/NotificationPermissionPrompt.tsx")
          nt = np.read_text()
          nt2 = re.sub(
              r"(useEffect\(\(\) => \{)\s*const uid = session\?\.userId;\s*if \(!uid\) return;",
              r"\1",
              nt,
              count=1,
          )
          if nt2 != nt:
              nt = nt2
              print("notif: uid gate removed")
          if "}, [session?.userId, session?.role]);" in nt:
              nt = nt.replace(
                  "}, [session?.userId, session?.role]);",
                  "}, []); // OS notif prompt independent of session",
                  1,
              )
              print("notif: deps")
          nt = nt.replace(
              "// After login: request REAL Android notification permission",
              "// App entry: request REAL Android notification permission (no session required)",
          )
          np.write_text(nt)
          print("notif", np.stat().st_size)

          # ===== 4. __root NativeBootstrap notif on entry =====
          root = Path("src/routes/__root.tsx")
          rt = root.read_text()
          if "d4_native_os_notif_asked_v2" not in rt:
              block = '''
  // Request POST_NOTIFICATIONS on native app entry (before login).
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        try {
          if (localStorage.getItem("d4_native_os_notif_asked_v2") === "1") return;
        } catch { /* ignore */ }
        const { waitForNativeShell, isNativeShell } = await import("@/native/platform");
        let ready = isNativeShell() || (await waitForNativeShell(12_000));
        if (!ready) {
          await new Promise((r) => setTimeout(r, 1500));
          ready = isNativeShell() || (await waitForNativeShell(6_000));
        }
        if (cancelled || !ready) return;
        await new Promise((r) => setTimeout(r, 800));
        if (cancelled) return;
        let display = "default";
        try {
          const { registerPlugin } = await import("@capacitor/core");
          const auth = registerPlugin<{
            checkNotificationPermission: () => Promise<{ display?: string }>;
            requestNotificationPermission: () => Promise<{ display?: string }>;
          }>("D4NativeAuth");
          const cur = await auth.checkNotificationPermission();
          display = (cur?.display || "default").toLowerCase();
          if (display !== "granted" && display !== "denied") {
            const req = await auth.requestNotificationPermission();
            display = (req?.display || display).toLowerCase();
          }
        } catch {
          try {
            const { LocalNotifications } = await import("@capacitor/local-notifications");
            const cur = await LocalNotifications.checkPermissions();
            display = (cur.display || "default").toLowerCase();
            if (display !== "granted" && display !== "denied") {
              const req = await LocalNotifications.requestPermissions();
              display = (req.display || display).toLowerCase();
            }
          } catch {
            return; // do not mark asked on plugin failure
          }
        }
        if (display === "granted" || display === "denied") {
          try { localStorage.setItem("d4_native_os_notif_asked_v2", "1"); } catch { /* ignore */ }
        }
      } catch (e) {
        console.warn("[D4EXAM] NativeBootstrap notif", e);
      }
    })();
    return () => { cancelled = true; };
  }, []);
'''
              idx = rt.find("function NativeBootstrap()")
              if idx >= 0:
                  ridx = rt.find("  return null;\n}", idx)
                  if ridx > idx:
                      rt = rt[:ridx] + block + "\n" + rt[ridx:]
                      print("root: notif inject")
              root.write_text(rt)
          print("root", root.stat().st_size)

          # ===== 5. screen-share stronger native detect =====
          ss = Path("src/lib/screen-share.ts")
          st = ss.read_text()
          if "Capacitor/i.test(ua)" not in st:
              st = st.replace(
                  "if (/; wv\\)/i.test(ua) && /Android/i.test(ua)) return true;",
                  "if (/; wv\\)/i.test(ua) && /Android/i.test(ua)) return true;\n    if (/Android/i.test(ua) && /Capacitor/i.test(ua)) return true;",
              )
              print("ss: Capacitor UA")
          ss.write_text(st)
          print("ss", ss.stat().st_size)

          # ===== 6. ScreenCaptureService: verify MEDIA_PROJECTION =====
          svc = Path("android/app/src/main/java/com/d4exam/app/ScreenCaptureService.java")
          if svc.exists():
              svt = svc.read_text()
              if "FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION" in svt:
                  print("svc: MEDIA_PROJECTION OK")
              else:
                  print("svc: MISSING MEDIA_PROJECTION - critical")

          print("DONE android apk final fixes")
          PY
      - name: Commit and push
        run: |
          git config user.name d4exam-bot
          git config user.email bot@d4exam.local
          git add -A
          git status
          git commit -m "fix(android): fingerprint primary, notif on entry, screen native detect (restore placeholders)" || echo nochange
          git push origin main
