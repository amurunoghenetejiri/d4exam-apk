name: write-root-only
on:
  workflow_dispatch:
jobs:
  write:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write __root from embedded base64
        run: |
          python3 -c "import base64; from pathlib import Path; print('run via dispatch')"
