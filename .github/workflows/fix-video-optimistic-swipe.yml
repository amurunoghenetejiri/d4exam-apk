name: fix-video-optimistic-swipe
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patches
        run: |
          set -euo pipefail
          python3 scripts/fix_video_ux.py
          git config user.name d4exam-bot
          git config user.email bot@d4exam.name.ng
          git add -A
          git commit -m "fix(messaging): optimistic video/image, smooth swipe, voice reply duration, video controls" || echo nochanges
          git push
