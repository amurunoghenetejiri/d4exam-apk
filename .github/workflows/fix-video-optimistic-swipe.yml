name: fix-video-optimistic-swipe
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch student route + MessageMedia
        run: |
          python3 -c "
          from pathlib import Path
          import re
          p=Path('src/routes/student.contact-officer.tsx'); t=p.read_text()
          m=re.search(r'async function onFile\\(files: FileList \\| File\\[\\]\\) \\{.*?\\n  \\}', t, re.S)
          assert m, 'onFile missing'
          new='''  async function onFile(files: FileList | File[]) {\n    const list = Array.from(files);\n    if (!list.length) return;\n    for (const file of list) {\n      const mime = (file.type || \"\").toLowerCase();\n      let kind: \"image\" | \"video\" | \"audio\" | \"file\" = \"file\";\n      if (mime.startsWith(\"image/\") || /\\.(jpe?g|png|gif|webp)$/i.test(file.name)) kind = \"image\";\n      else if (mime.startsWith(\"video/\") || /\\.(mp4|webm|mov)$/i.test(file.name)) kind = \"video\";\n      else if (mime.startsWith(\"audio/\")) kind = \"audio\";\n      const localUrl = URL.createObjectURL(file);\n      const clientId = \\`opt-\\${Date.now()}-\\${Math.random().toString(36).slice(2, 8)}\\`;\n      const nowIso = new Date().toISOString();\n      const replySnap = replyTo;\n      const optMsg: ChatMsg = { key: \\`\\${clientId}-s\\`, side: \"out\", text: \"(attachment)\", at: nowIso, subject: replySnap ? \\`Re: \\${(replySnap.text || \"\").slice(0, 40)}\\` : subject.trim() || null, attachment_url: localUrl, attachment_type: kind, reportId: clientId, replyPreview: null, replyToKey: replySnap ? \\\\`\\${replySnap.id}-\\${replySnap.fromSelf ? \"s\" : \"o\"}\\` : null };\n      setOptimisticMsgs((prev) => [...prev, optMsg]);\n      setReplyTo(null); setPendingAttach(null); setNearBottom(true); setNewBelow(0);\n      requestAnimationFrame(() => chatEndRef.current?.scrollIntoView({ behavior: \"smooth\" }));\n      void (async () => {\n        try {\n          const up = await uploadMessageMedia(file, file.type || \"application/octet-stream\", \\`msg/\\${schoolId}/\\${userId}\\`);\n          const name = session?.fullName || student?.fullName || \"Student\";\n          const payload: Record<string, unknown> = { school_id: schoolId, student_id: studentId || null, student_user_id: userId || null, student_name: name, student_matric: student?.matric || null, exam_id: selectedExamIds[0] || null, exam_title: null, exam_ids: selectedExamIds.length ? selectedExamIds : [], exam_titles: [], subject: optMsg.subject, body: \"(attachment)\", attachment_url: up.url, attachment_type: kind === \"file\" ? (up.type || \"file\") : kind, status: \"open\", reply_to_id: replySnap?.id || null };\n          const { error } = await supabase.from(\"student_officer_reports\").insert(payload);\n          if (error) throw error;\n          setOptimisticMsgs((prev) => prev.filter((m) => m.reportId !== clientId));\n          await qc.invalidateQueries({ queryKey: [\"student-my-reports\"] });\n          try { URL.revokeObjectURL(localUrl); } catch {}\n        } catch (e) { setFailedIds((s) => new Set(s).add(clientId)); toast.error(e instanceof Error ? e.message : \"Upload failed\"); }\n      })();\n    }\n  }'''
          t=t[:m.start()]+new+t[m.end():]
          for a,b in [('Math.max(-72, Math.min(72, dx))','Math.max(-96, Math.min(96, dx))'),('transform 0.22s cubic-bezier(.2,.8,.2,1)','transform 0.28s cubic-bezier(.2,.85,.25,1)'),('Math.max(-80, Math.min(80, rawX))','Math.max(-96, Math.min(96, rawX))'),('Math.abs(dx) > 48','Math.abs(dx) > 40'),('Math.abs(finalDx) > 48','Math.abs(finalDx) > 40')]:
            t=t.replace(a,b)
          if 'willChange: \"transform\"' not in t: t=t.replace('touchAction: \"pan-y\",','touchAction: \"pan-y\",\\n                  willChange: \"transform\",')
          p.write_text(t); print('student ok', len(t))
          mm=Path('src/components/messaging/MessageMedia.tsx'); m=mm.read_text()
          if 'data-duration={effectiveDur' not in m:
            m=m.replace('    <div\\n      id={id}\\n      className={cn(\\n        \"flex min-w-[200px] flex-col gap-0.5 select-none\",','    <div\\n      id={id}\\n      data-duration={effectiveDur > 0 ? String(Math.round(effectiveDur)) : undefined}\\n      className={cn(\\n        \"flex min-w-[200px] flex-col gap-0.5 select-none\",')
          old='''      <span className=\"absolute inset-0 grid place-items-center\">\\n        <span className=\"grid h-12 w-12 place-items-center rounded-full bg-black/55 text-white shadow-lg ring-2 ring-white/40\">\\n          <Play className=\"ml-0.5 h-6 w-6\" />\\n        </span>\\n      </span>'''
          newv='''      <span className=\"absolute inset-0 grid place-items-center\">\\n        {tick === \"pending\" ? (\\n          <span className=\"grid h-12 w-12 place-items-center rounded-full bg-black/55 text-white shadow-lg ring-2 ring-white/40\">\\n            <Clock className=\"h-6 w-6 animate-pulse\" />\\n          </span>\\n        ) : (\\n          <span className=\"grid h-12 w-12 place-items-center rounded-full bg-black/55 text-white shadow-lg ring-2 ring-white/40\">\\n            <Play className=\"ml-0.5 h-6 w-6\" />\\n          </span>\\n        )}\\n      </span>'''
          if old in m: m=m.replace(old,newv,1); print('videobubble')
          mm.write_text(m); print('mm ok')
          "
          git config user.name d4exam-bot
          git config user.email bot@d4exam.name.ng
          git add src/routes/student.contact-officer.tsx src/components/messaging/MessageMedia.tsx
          git commit -m "fix(messaging): optimistic video/image show immediately with pending clock; smoother swipe" || echo nochanges
          git push
