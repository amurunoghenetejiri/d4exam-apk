name: fix-wave-seek-strict
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Strict horizontal-only wave seek + smooth swipe
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          p = Path("src/components/messaging/MessageMedia.tsx")
          t = p.read_text()

          pattern = re.compile(
              r'  const dragRef = useRef<\{ x: number; y: number; active: boolean; seeking: boolean \} \| null>\(null\);\n'
              r'  const pct = Math\.max\(0, Math\.min\(1, progress\)\);\n'
              r'  const filledCount = Math\.min\(heights\.length, Math\.floor\(pct \* heights\.length \+ 0\.001\)\);\n\n'
              r'  const seekFromClientX = \(clientX: number\) => \{\n'
              r'    const el = trackRef\.current;\n'
              r'    if \(!el \|\| !onSeek\) return;\n'
              r'    const rect = el\.getBoundingClientRect\(\);\n'
              r'    const ratio = Math\.max\(0, Math\.min\(1, \(clientX - rect\.left\) / Math\.max\(1, rect\.width\)\)\);\n'
              r'    onSeek\(ratio\);\n'
              r'  \};\n\n'
              r'  return \(\n'
              r'    <div\n'
              r'      ref=\{trackRef\}\n'
              r'      className=\{cn\("relative flex h-7 w-full items-center gap-\[1\.5px\] overflow-visible px-1", onSeek && "cursor-pointer touch-none"\)\}\n'
              r'      onPointerDown=\{\(e\) => \{.*?\}\}\n'
              r'      onPointerMove=\{\(e\) => \{.*?\}\}\n'
              r'      onPointerUp=\{\(e\) => \{.*?\}\}\n'
              r'      onPointerCancel=\{\(\) => \{.*?\}\}\n'
              r'      onClick=\{\(e\) => \{.*?\}\}\n'
              r'    >',
              re.S,
          )
          m = pattern.search(t)
          if not m:
              raise SystemExit("WaveBars handlers pattern not matched")

          replacement = """  const dragRef = useRef<{ x: number; y: number; active: boolean; seeking: boolean; pid: number } | null>(null);
  const pct = Math.max(0, Math.min(1, progress));
  const filledCount = Math.min(heights.length, Math.floor(pct * heights.length + 0.001));

  const seekFromClientX = (clientX: number) => {
    const el = trackRef.current;
    if (!el || !onSeek) return;
    const rect = el.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / Math.max(1, rect.width)));
    onSeek(ratio);
  };

  return (
    <div
      ref={trackRef}
      className={cn("relative flex h-7 w-full items-center gap-[1.5px] overflow-visible px-1", onSeek && "cursor-pointer")}
      style={onSeek ? { touchAction: "pan-y" } : undefined}
      onPointerDown={(e) => {
        if (!onSeek) return;
        // Arm only - do NOT move the board/ball on mere touch or click
        dragRef.current = { x: e.clientX, y: e.clientY, active: true, seeking: false, pid: e.pointerId };
      }}
      onPointerMove={(e) => {
        if (!onSeek || !dragRef.current?.active) return;
        const d = dragRef.current;
        if (d.pid !== e.pointerId) return;
        const dx = e.clientX - d.x;
        const dy = e.clientY - d.y;
        if (!d.seeking) {
          // Require clear intentional horizontal drag before any seek.
          // Vertical / jitter must never move the board.
          if (Math.abs(dx) < 22) return;
          if (Math.abs(dy) >= Math.abs(dx) * 0.55) {
            d.active = false;
            return;
          }
          d.seeking = true;
          try { (e.currentTarget as HTMLElement).setPointerCapture?.(e.pointerId); } catch {}
          e.preventDefault();
          e.stopPropagation();
          seekFromClientX(e.clientX);
          return;
        }
        // Locked horizontal seek - follow the wave only (no vertical)
        e.preventDefault();
        e.stopPropagation();
        seekFromClientX(e.clientX);
      }}
      onPointerUp={(e) => {
        if (dragRef.current?.seeking) e.stopPropagation();
        dragRef.current = null;
      }}
      onPointerCancel={() => { dragRef.current = null; }}
      onClick={(e) => {
        // Never seek on click/tap - only drag moves the board
        e.stopPropagation();
      }}
    >"""
          t = t[:m.start()] + replacement + t[m.end():]
          p.write_text(t)
          print("MessageMedia WaveBars strict OK", len(t))

          c = Path("src/routes/student.contact-officer.tsx")
          ct = c.read_text()
          n = 0
          a = 'transition: dx === 0 ? "transform 0.28s cubic-bezier(.2,.85,.25,1)" : "none"'
          b = 'transition: dx === 0 ? "transform 0.32s cubic-bezier(.22,.9,.28,1)" : "none"'
          if a in ct:
              ct = ct.replace(a, b)
              n += 1
          a2 = 'if (Math.abs(rawX) < 8 && Math.abs(rawY) < 8) return;\n                    s.axis = Math.abs(rawX) > Math.abs(rawY) ? "h" : "v";'
          b2 = 'if (Math.abs(rawX) < 12 && Math.abs(rawY) < 12) return;\n                    s.axis = Math.abs(rawX) > Math.abs(rawY) * 1.15 ? "h" : "v";'
          if a2 in ct:
              ct = ct.replace(a2, b2)
              n += 1
          c.write_text(ct)
          print("contact-officer swipe smooth replacements:", n)
          PY
          git config user.name d4exam-bot
          git config user.email bot@d4exam.name.ng
          git add src/components/messaging/MessageMedia.tsx src/routes/student.contact-officer.tsx
          git diff --cached --stat
          git commit -m "fix(messaging): voice board only moves on real horizontal drag; smooth reply swipe" || echo nochange
          git push
